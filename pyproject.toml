[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coordinate"
version = "0.4.2"
description = "Deterministic coordination kernel and durable control plane for multi-agent harness systems"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
daemon = ["discord.py>=2.3"]
mcp = ["mcp>=2,<3"]
runtime-http = ["aiohttp>=3.9"]

[project.scripts]
coordinate = "coordinate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
